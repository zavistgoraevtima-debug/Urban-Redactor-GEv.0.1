<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>UrbanRedactor-GE — Регистрация</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif;}
        body{background:#121314;background-image:linear-gradient(to right,rgba(0,0,0,0.85) 35%,rgba(0,0,0,0.2) 100%),url('image_VtLq8s.png');background-size:cover;background-position:center;height:100vh;display:flex;overflow:hidden;}
        .as{width:420px;background:#2d2e31;padding:40px 32px;display:flex;flex-direction:column;justify-content:center;box-shadow:5px 0 25px rgba(0,0,0,0.5);z-index:10;animation:slideDown 0.8s ease forwards;}
        @keyframes slideDown{from{transform:translateY(-100%);}to{transform:translateY(0);}}
        .fg{margin-bottom:20px;display:flex;flex-direction:column;gap:6px;color:#fff;}
        .fg input{width:100%;padding:12px;background:#1f2023;border:1px solid #3c4043;color:#fff;border-radius:8px;outline:none;}
        .fg input:focus{border-color:#1a73e8;}
        .ab{width:80px;height:80px;background:#5f6368;border-radius:50%;cursor:pointer;border:none;background-size:cover;background-position:center;align-self:center;margin:20px 0;display:flex;align-items:center;justify-content:center;}
        .ab::before{content:"👤";font-size:2.2rem;filter:grayscale(1) opacity(0.4);} .ab.hi::before{display:none;}
        .sbtn{width:100%;padding:14px;background:#500000;color:#fff;border:none;font-weight:bold;border-radius:8px;cursor:pointer;text-transform:uppercase;}
        .pc{flex:1;padding:60px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;z-index:5;animation:slideText 0.8s ease 0.4s forwards;opacity:0;}
        @keyframes slideText{from{transform:translateY(-50px);opacity:0;}to{transform:translateY(0);opacity:1;}}
    </style>
</head>
<body>
    <aside class="as">
        <div><h1 style="font-size:1.4rem;color:#fff;">UrbanRedactor-GE</h1><div style="font-size:0.95rem;color:#1a73e8;margin-bottom:35px;" id="fS">Страничка Регистрации</div></div>
        <div>
            <div class="fg"><label>Ваш Никнейм</label><input type="text" id="nickname" placeholder="Vanya22"></div>
            <div class="fg"><label>Ваш Логин</label><input type="text" id="userLogin" placeholder="@vanya22"></div>
            <div class="fg Desert-field"><label>Ваша Почта</label><input type="email" id="userEmail" placeholder="vanya22@gmail.com"></div>
            <div class="avatar-container fg Desert-field">
                <input type="file" id="fileInput" accept="image/*" style="display:none;">
                <button type="button" id="avatarBtn" class="ab"></button>
                <div style="font-size:0.85rem;color:#9aa0a6;text-align:center;">Сменить аватар</div>
            </div>
        </div>
        <div style="font-size:0.85rem;color:#9aa0a6;margin-bottom:20px;" id="tB">Уже есть Аккаунт? <button type="button" id="toLoginBtn" style="color:#1a73e8;background:none;border:none;cursor:pointer;font-weight:bold;">Войти</button></div>
        <button class="sbtn" id="submitActionBtn" type="button">Зарегистрироваться</button>
    </aside>
    <main class="pc">
        <div><h2 style="font-size:3.5rem;">UrbanRedactor-GE.</h2><p style="font-size:1.5rem;font-weight:300;">Воплотите город своей мечты</p></div>
        <div style="align-self:flex-end;font-size:1.1rem;color:#9aa0a6;animation:slideR 0.8s ease 0.6s forwards;opacity:0;">Автор: Krossovok12</div>
    </main>
    <script>
        (function(){
            var imgData=''; var isLogin=false;
            window.addEventListener('DOMContentLoaded',function(){
                var btn=document.getElementById('avatarBtn'),file=document.getElementById('fileInput'),toLog=document.getElementById('toLoginBtn'),sub=document.getElementById('submitActionBtn'),subT=document.getElementById('fS'),tB=document.getElementById('tB');
                if(btn&&file){btn.addEventListener('click',function(){file.click();});}
                if(file){file.addEventListener('change',function(e){var input=e.target;if(input.files&&input.files[0]){var r=new FileReader();r.onload=function(ev){if(btn&&ev.target&&ev.target.result){imgData=ev.target.result;btn.style.backgroundImage="url('"+imgData+"')";btn.classList.add('hi');}};r.readAsDataURL(input.files[0]);}});}
                if(toLog){toLog.addEventListener('click',function(){
                    if(!isLogin){isLogin=true; if(subT)subT.innerText="Страничка Авторизации"; if(sub)sub.innerText="Войти в систему"; document.querySelectorAll('.Desert-field').forEach(el=>{el.style.display='none';}); if(tB)tB.innerHTML='Еще нет аккаунта? <button type="button" id="toRegBtn" style="color:#1a73e8;background:none;border:none;cursor:pointer;font-weight:bold;">Регистрация</button>'; document.getElementById('toRegBtn').addEventListener('click',function(){window.location.reload();});}
                });}
                if(sub){sub.addEventListener('click',function(){
                    var n=document.getElementById('nickname'),m=document.getElementById('userEmail');
                    if(n&&n instanceof HTMLInputElement)localStorage.setItem('urban_username',n.value||'Пользователь');
                    if(m&&m instanceof HTMLInputElement)localStorage.setItem('urban_email',m.value||'example@gmail.com');
                    if(imgData)localStorage.setItem('urban_avatar',imgData);
                    window.location.href='index.html'; // Прямой чистый переход в корень кучи
                });}
            });
        })();
    </script>
</body>
</html>
