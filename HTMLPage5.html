<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>UrbanRedactor-GE — Создать проект</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif;}
        body{background-color:#1f2023;color:#e3e3e3;min-height:100vh;display:flex;flex-direction:column;padding:24px;justify-content:center;align-items:center;}
        .mcard{background-color:#242528;border:1px solid #3c4043;border-radius:16px;width:100%;max-width:500px;padding:28px;display:flex;flex-direction:column;gap:24px;box-shadow:0 12px 36px rgba(0,0,0,0.4);}
        .fg{display:flex;flex-direction:column;gap:6px;}
        .fg input[type="text"]{width:100%;padding:12px;background-color:#1f2023;border:1px solid #3c4043;color:#ffffff;border-radius:8px;outline:none;}
        .mwrap{width:100%;height:320px;background-color:#121314;border:1px solid #3c4043;border-radius:10px;overflow:hidden;}
        #map{width:100%;height:100%;}
        .mwrap.night-mode{filter:invert(1) hue-rotate(180deg) brightness(0.6) contrast(1.2); transition:filter 0.3s;}
        .cgrp{display:flex;gap:24px;} .cbox{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
        .fbtn{background-color:#ea4335;color:#ffffff;border:none;font-size:1.1rem;font-weight:bold;padding:14px;width:100%;border-radius:8px;cursor:pointer;text-transform:uppercase;box-shadow:0 4px 12px rgba(234,67,53,0.25);}
    </style>
    <!-- Подключаем стабильную библиотеку Leaflet вместо Яндекса -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
</head>
<body>
    <h1 style="font-size:1.4rem;color:#1a73e8;margin-bottom:24px;text-transform:uppercase;letter-spacing:1px;">Создать новый проект</h1>
    <div class="mcard">
        <div class="fg"><label>Название проекта:</label><input type="text" id="projName" value="Новый проект-1"></div>
        <div class="mwrap" id="mapFrame"><div id="map"></div></div>
        <div class="fg"><label>Масштаб:</label><input type="text" id="projScale" readonly value="39136 px/px"></div>
        <div class="cgrp">
            <label class="cbox"><input type="checkbox" id="timeNight"><span>Ночь</span></label>
            <label class="cbox"><input type="checkbox" id="timeDay" checked><span>День</span></label>
        </div>
        <button type="button" class="fbtn" id="startProjectBtn">Вперёд!</button>
    </div>
    <script>
        (function(){
            var leafletMap = null;
            window.addEventListener('DOMContentLoaded', function(){
                var mapEl = document.getElementById('map');
                if(mapEl && typeof L !== 'undefined'){
                    // Создаем карту с центром на пустой местности
                    leafletMap = L.map('map', {
                        center: [20.0, 0.0],
                        zoom: 2,
                        zoomControl: true,
                        attributionControl: false
                    });
                    
                    // Загружаем чистый мировой спутниковый слой без городов и дорог
                    L.tileLayer('https://arcgisonline.com{z}/{y}/{x}', {
                        maxZoom: 18
                    }).addTo(leafletMap);

                    leafletMap.on('zoomend', function() {
                        var scaleInput = document.getElementById('projScale');
                        if (leafletMap && scaleInput) {
                            var res = Math.round(156543 / Math.pow(2, leafletMap.getZoom()));
                            scaleInput.value = res + " px/px";
                        }
                    });
                }

                var nb = document.getElementById('timeNight'), db = document.getElementById('timeDay'), mf = document.getElementById('mapFrame');
                if(nb && db){
                    nb.addEventListener('change', function(){db.checked = !nb.checked; if(mf){if(nb.checked)mf.classList.add('night-mode'); else mf.classList.remove('night-mode');}});
                    db.addEventListener('change', function(){nb.checked = !db.checked; if(mf){if(db.checked)mf.classList.remove('night-mode'); else mf.classList.add('night-mode');}});
                }

                var sb = document.getElementById('startProjectBtn');
                if(sb){sb.addEventListener('click', function(){
                    var i = document.getElementById('projName'); if(i && i instanceof HTMLInputElement) localStorage.setItem('urban_current_project_name', i.value || 'Без названия');
                    alert("Проект успешно настроен! Переход в симулятор.");
                    window.location.href = 'index.html';
                });}
            });
        })();
    </script>
</body>
</html>
